<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendar · LUMÉ Beauty Room</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Encabezado -->
  <header class="page-head">
    <div class="container row">
      <a href="index.html"><img src="logo.png" alt="LUMÉ Beauty Room"></a>
      <div class="links">
        <a id="waBtn" class="icon-btn wa" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.004c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 1.67c2.2 0 4.27.86 5.83 2.42a8.2 8.2 0 0 1 2.42 5.82c0 4.54-3.7 8.24-8.25 8.24a8.2 8.2 0 0 1-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.18 8.18 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24Zm-4.53 4.4c-.21 0-.55.08-.84.39-.29.31-1.1 1.08-1.1 2.62 0 1.55 1.13 3.04 1.28 3.25.16.21 2.2 3.36 5.32 4.58.74.32 1.32.51 1.77.65.74.24 1.42.2 1.96.12.6-.09 1.84-.75 2.1-1.48.26-.73.26-1.35.18-1.48-.08-.13-.29-.21-.6-.36-.31-.16-1.84-.91-2.12-1.01-.29-.11-.5-.16-.71.16-.21.31-.81 1.01-1 1.22-.18.21-.37.24-.68.08-.31-.16-1.31-.48-2.5-1.54-.92-.82-1.55-1.84-1.73-2.15-.18-.31-.02-.48.14-.63.14-.14.31-.37.47-.55.16-.18.21-.31.31-.52.11-.21.05-.39-.03-.55-.08-.16-.71-1.7-.97-2.33-.26-.62-.52-.53-.71-.54l-.61-.01Z"/></svg>
        </a>
        <a id="igBtn" class="icon-btn ig" href="#" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41-.56-.22-.96-.48-1.38-.9-.42-.42-.68-.82-.9-1.38-.16-.42-.36-1.06-.41-2.23C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41C8.42 2.17 8.8 2.16 12 2.16Zm0 1.62c-3.15 0-3.52.01-4.76.07-.98.04-1.51.21-1.86.35-.47.18-.8.4-1.15.75-.35.35-.57.68-.75 1.15-.14.35-.31.88-.35 1.86-.06 1.24-.07 1.61-.07 4.76s.01 3.52.07 4.76c.04.98.21 1.51.35 1.86.18.47.4.8.75 1.15.35.35.68.57 1.15.75.35.14.88.31 1.86.35 1.24.06 1.61.07 4.76.07s3.52-.01 4.76-.07c.98-.04 1.51-.21 1.86-.35.47-.18.8-.4 1.15-.75.35-.35.57-.68.75-1.15.14-.35.31-.88.35-1.86.06-1.24.07-1.61.07-4.76s-.01-3.52-.07-4.76c-.04-.98-.21-1.51-.35-1.86a3.1 3.1 0 0 0-.75-1.15 3.1 3.1 0 0 0-1.15-.75c-.35-.14-.88-.31-1.86-.35-1.24-.06-1.61-.07-4.76-.07Zm0 2.76a5.3 5.3 0 1 1 0 10.6 5.3 5.3 0 0 1 0-10.6Zm0 1.62a3.68 3.68 0 1 0 0 7.36 3.68 3.68 0 0 0 0-7.36Zm5.5-.42a1.24 1.24 0 1 1-2.48 0 1.24 1.24 0 0 1 2.48 0Z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="section-title">
      <span class="display" style="font-size:clamp(2rem,7vw,3rem)">SERVICIOS</span>
    </div>
    <p class="section-sub">Elige tus servicios con <strong>+ / −</strong>. Al seleccionar aparecerá tu carrito para agendar día y hora.</p>

    <div id="catalog"></div>
    <div style="height:120px"></div>
  </div>

  <!-- Botón flotante del carrito -->
  <button id="cartFab" class="cart-fab" aria-label="Ver carrito">
    <span class="count" id="fabCount">0</span>
    <span>Carrito</span>
    <span class="amt" id="fabAmt">$0</span>
  </button>

  <!-- Drawer del carrito -->
  <div class="drawer-mask" id="drawerMask"></div>
  <aside class="drawer" id="drawer" aria-label="Carrito">
    <div class="drawer-head">
      <h3>Tu cita</h3>
      <button class="x-btn" id="drawerClose" aria-label="Cerrar">&times;</button>
    </div>
    <div class="drawer-body">
      <div id="cartLines"></div>

      <div class="field" style="margin-top:20px">
        <label>Nombre del cliente <span class="req">*</span></label>
        <input class="input" id="cName" type="text" placeholder="Nombre y apellido" autocomplete="name">
        <div class="err-msg">Escribe el nombre.</div>
      </div>
      <div class="field">
        <label>Teléfono <span class="req">*</span></label>
        <input class="input" id="cPhone" type="tel" placeholder="10 dígitos" autocomplete="tel" inputmode="numeric">
        <div class="err-msg">Escribe un teléfono válido (al menos 10 dígitos).</div>
      </div>
      <div class="field">
        <label>Descripción / notas <span class="muted">(opcional)</span></label>
        <textarea class="textarea" id="cNote" placeholder="Ej. diseño en rosa, alergias, referencia..."></textarea>
      </div>
      <div class="two-col">
        <div class="field">
          <label>Día <span class="req">*</span></label>
          <input class="input" id="cDate" type="date">
          <div class="err-msg">Elige un día.</div>
        </div>
        <div class="field">
          <label>Hora <span class="req">*</span></label>
          <input class="input" id="cTime" type="time">
          <div class="err-msg">Elige una hora.</div>
        </div>
      </div>
    </div>
    <div class="drawer-foot">
      <div class="total-row">
        <span class="t-label">Total estimado</span>
        <span class="t-amt" id="drawerTotal">$0</span>
      </div>
      <button class="btn block" id="confirmBtn">Agendar</button>
    </div>
  </aside>

  <!-- Tarjeta wallet: cita confirmada -->
  <div class="pass-mask" id="passMask">
    <div class="pass-box">
      <img id="passImg" class="pass-img" alt="Cita confirmada">
      <div class="pass-actions">
        <button class="btn soft" id="passDownload">⬇ Descargar</button>
        <button class="btn" id="passWhats">Enviar por WhatsApp</button>
      </div>
      <p style="margin-top:14px">
        <a href="index.html" class="muted" style="text-decoration:none">Volver al inicio</a>
        &nbsp;·&nbsp;
        <a href="#" id="passAgain" class="muted" style="text-decoration:none">Agendar otra</a>
      </p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script src="firebase.js"></script>
  <script>
    Data.init(); // conecta con Firebase (o modo local si no hay internet)
    document.getElementById("waBtn").href = waLink(CONFIG.whatsapp, "¡Hola LUMÉ! Quiero agendar una cita ✨");
    document.getElementById("igBtn").href = igLink(CONFIG.instagram);

    // ---- estado del carrito: { serviceId: qty } ----
    const cart = {};

    // ---- render del catálogo ----
    const catalog = document.getElementById("catalog");
    SERVICES.forEach(group => {
      const block = document.createElement("section");
      block.className = "cat-block";
      block.innerHTML = `
        <div class="cat-head"><h2>${group.cat}</h2><div class="line"></div></div>
        <div class="grid">
          ${group.items.map(it => `
            <article class="service" data-id="${it.id}">
              <div class="s-top">
                <h3>${it.name}</h3>
                <span class="price">${priceLabel(it)}</span>
              </div>
              <p class="desc">${it.desc}</p>
              <div class="s-actions">
                <span class="badge-added">✓ Agregado</span>
                <div class="control" data-id="${it.id}"></div>
              </div>
            </article>`).join("")}
        </div>`;
      catalog.appendChild(block);
    });

    function controlHTML(id){
      const q = cart[id] || 0;
      if(!q){
        return `<button class="btn sm add" data-act="add" data-id="${id}">+ Agregar</button>`;
      }
      return `<div class="stepper">
        <button data-act="dec" data-id="${id}" aria-label="Quitar">−</button>
        <span class="qty">${q}</span>
        <button data-act="inc" data-id="${id}" aria-label="Agregar">+</button>
      </div>`;
    }

    function totalEst(){
      return Object.keys(cart).reduce((s,id)=> s + (cart[id]*SERVICE_INDEX[id].min), 0);
    }
    function count(){
      return Object.keys(cart).reduce((s,id)=> s + cart[id], 0);
    }

    function syncCard(id){
      const card = document.querySelector(`.service[data-id="${id}"]`);
      if(card){
        card.classList.toggle("selected", !!cart[id]);
        card.querySelector(".control").innerHTML = controlHTML(id);
      }
    }

    function syncCart(){
      // FAB
      const c = count();
      const fab = document.getElementById("cartFab");
      document.getElementById("fabCount").textContent = c;
      document.getElementById("fabAmt").textContent = money(totalEst());
      fab.classList.toggle("show", c > 0);

      // líneas del drawer
      const lines = document.getElementById("cartLines");
      const ids = Object.keys(cart);
      if(!ids.length){
        lines.innerHTML = `<div class="cart-empty">Aún no has agregado servicios.</div>`;
      } else {
        lines.innerHTML = ids.map(id => {
          const it = SERVICE_INDEX[id];
          return `<div class="cart-line">
            <div class="cl-main">
              <div class="cl-name">${it.name}</div>
              <div class="cl-price">${priceLabel(it)}</div>
            </div>
            <div class="stepper">
              <button data-act="dec" data-id="${id}">−</button>
              <span class="qty">${cart[id]}</span>
              <button data-act="inc" data-id="${id}">+</button>
            </div>
          </div>`;
        }).join("");
      }
      document.getElementById("drawerTotal").textContent = money(totalEst());
    }

    function change(id, delta){
      const q = (cart[id]||0) + delta;
      if(q <= 0) delete cart[id]; else cart[id] = q;
      syncCard(id);
      syncCart();
    }

    // delegación de clicks (catálogo + drawer)
    document.addEventListener("click", (e)=>{
      const btn = e.target.closest("[data-act]");
      if(!btn) return;
      const id = btn.dataset.id;
      if(btn.dataset.act === "add" || btn.dataset.act === "inc") change(id, +1);
      else if(btn.dataset.act === "dec") change(id, -1);
    });

    // abrir / cerrar drawer
    const drawer = document.getElementById("drawer");
    const mask = document.getElementById("drawerMask");
    function openDrawer(){ drawer.classList.add("open"); mask.classList.add("open"); }
    function closeDrawer(){ drawer.classList.remove("open"); mask.classList.remove("open"); }
    document.getElementById("cartFab").addEventListener("click", openDrawer);
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
    mask.addEventListener("click", closeDrawer);

    // inicializar los controles +/− de cada servicio
    SERVICES.forEach(g => g.items.forEach(it => syncCard(it.id)));

    // fecha mínima = hoy
    const dateInput = document.getElementById("cDate");
    dateInput.min = todayISO();

    // validación de campos
    function markField(el, ok){
      const field = el.closest(".field");
      field.classList.toggle("invalid", !ok);
      return ok;
    }
    ["cName","cPhone","cDate","cTime"].forEach(idf=>{
      document.getElementById(idf).addEventListener("input", e=>{
        e.target.closest(".field").classList.remove("invalid");
      });
    });

    // confirmar / agendar
    const confirmBtn = document.getElementById("confirmBtn");
    const wait = (ms)=> new Promise(r=> setTimeout(r, ms));
    confirmBtn.addEventListener("click", async ()=>{
      const ids = Object.keys(cart);
      if(!ids.length){ toast("Agrega al menos un servicio."); return; }

      const name = document.getElementById("cName").value.trim();
      const phone = document.getElementById("cPhone").value.trim();
      const note = document.getElementById("cNote").value.trim();
      const date = document.getElementById("cDate").value;
      const time = document.getElementById("cTime").value;

      let ok = true;
      ok = markField(document.getElementById("cName"), name.length >= 2) && ok;
      ok = markField(document.getElementById("cPhone"), phone.replace(/\D/g,"").length >= 10) && ok;
      ok = markField(document.getElementById("cDate"), !!date) && ok;
      ok = markField(document.getElementById("cTime"), !!time) && ok;
      if(!ok){ toast("Completa los campos obligatorios."); return; }

      const booking = {
        id: uid(),
        createdAt: new Date().toISOString(),
        date, time,
        client: { name, phone, note },
        items: ids.map(id => {
          const it = SERVICE_INDEX[id];
          return { id, name: it.name, qty: cart[id], min: it.min, max: it.max, cat: it.cat };
        }),
        estTotal: totalEst(),
        status: "pendiente"
      };

      // guardar en Firebase (con respaldo local automático)
      confirmBtn.disabled = true;
      confirmBtn.textContent = "Agendando…";
      try{ await Promise.race([ Data.put("bookings", booking), wait(5000) ]); }
      catch(e){ /* si algo falla, Data ya respaldó en local */ }
      confirmBtn.disabled = false;
      confirmBtn.textContent = "Agendar";

      // mostrar tarjeta de confirmación tipo wallet
      closeDrawer();
      await showPass(booking);

      // limpiar carrito y formulario para una siguiente cita
      Object.keys(cart).forEach(k=> delete cart[k]);
      SERVICES.forEach(g => g.items.forEach(it => syncCard(it.id)));
      syncCart();
      ["cName","cPhone","cNote","cDate","cTime"].forEach(id=> document.getElementById(id).value="");
    });

    /* ---------- Tarjeta wallet de confirmación ---------- */
    const DAYS_FULL = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
    function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin="anonymous"; im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
    function roundRectPath(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    function dline(ctx,x1,x2,yy){ ctx.save(); ctx.strokeStyle="#cbc5b6"; ctx.lineWidth=2; ctx.setLineDash([7,7]); ctx.beginPath(); ctx.moveTo(x1,yy); ctx.lineTo(x2,yy); ctx.stroke(); ctx.restore(); }
    function label(ctx,txt,x,y){ ctx.save(); ctx.fillStyle="#8a877d"; ctx.font="600 16px 'Jost',Arial,sans-serif"; ctx.textAlign="left"; ctx.fillText(txt,x,y); ctx.restore(); }

    async function makeWalletCard(bk){
      const W=720, r=44, lw=320;
      try{ await Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1500))]); }catch(e){}
      const logo=await loadImg("logo.png").catch(()=>null);
      const lh = logo ? lw*(logo.naturalHeight/logo.naturalWidth) : 100;
      const N = bk.items.length;
      const H = Math.round(80 + lh + 8 + 46 + 44 + 54 + 44 + 64 + 40 + 34 + 56 + 40 + 36*N + 20 + 54 + 32 + 40 + 46);
      const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
      const ctx=cv.getContext("2d");

      ctx.clearRect(0,0,W,H);
      roundRectPath(ctx,0,0,W,H,r); ctx.save(); ctx.clip();
      ctx.fillStyle="#efece4"; ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#141311"; ctx.fillRect(0,0,W,14);
      const cx=W/2; let y=80;

      if(logo){ ctx.drawImage(logo,(W-lw)/2,y,lw,lh); y+=lh+8; }
      else { ctx.fillStyle="#141311"; ctx.textAlign="center"; ctx.font="700 46px 'Archivo Black',Arial,sans-serif"; ctx.fillText(CONFIG.businessName,cx,y+50); y+=100; }

      // check verde
      ctx.fillStyle="#2e7d54"; ctx.beginPath(); ctx.arc(cx,y+4,17,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#fff"; ctx.lineWidth=4; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(cx-8,y+4); ctx.lineTo(cx-2,y+10); ctx.lineTo(cx+9,y-4); ctx.stroke();
      y+=46;
      ctx.fillStyle="#6f6d64"; ctx.textAlign="center"; ctx.font="600 22px 'Jost',Arial,sans-serif";
      ctx.fillText("CITA CONFIRMADA", cx, y); y+=44;
      dline(ctx,60,W-60,y); y+=54;

      ctx.textAlign="left";
      label(ctx,"NOMBRE",64,y); y+=44;
      ctx.fillStyle="#141311"; ctx.font="700 42px 'Archivo Black',Arial,sans-serif"; ctx.fillText(bk.client.name,64,y); y+=64;

      const dt=new Date(bk.date+"T00:00:00");
      const dayName=DAYS_FULL[dt.getDay()];
      const dateStr=dt.toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
      label(ctx,"DÍA",64,y); label(ctx,"HORA",W/2+40,y); y+=40;
      ctx.fillStyle="#141311"; ctx.font="500 28px 'Jost',Arial,sans-serif"; ctx.fillText(dayName,64,y);
      ctx.font="700 36px 'Archivo Black',Arial,sans-serif"; ctx.fillText(bk.time||"",W/2+40,y);
      y+=34; ctx.fillStyle="#6f6d64"; ctx.font="400 22px 'Jost',Arial,sans-serif"; ctx.fillText(dateStr,64,y);
      y+=56;

      label(ctx,"SERVICIOS",64,y); y+=40;
      ctx.fillStyle="#141311"; ctx.font="400 25px 'Jost',Arial,sans-serif";
      bk.items.forEach(it=>{ ctx.fillText(`•  ${it.qty}× ${it.name}`,64,y); y+=36; });
      y+=20;

      dline(ctx,40,W-40,y);
      ctx.save(); ctx.globalCompositeOperation="destination-out";
      ctx.beginPath(); ctx.arc(0,y,24,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(W,y,24,0,Math.PI*2); ctx.fill();
      ctx.restore();
      y+=54;

      ctx.textAlign="center"; ctx.fillStyle="#6f6d64"; ctx.font="400 21px 'Jost',Arial,sans-serif";
      ctx.fillText("Presenta esta tarjeta al llegar", cx, y); y+=32;
      const ig=(CONFIG.instagram||"").replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/^@/,"").replace(/\/$/,"");
      if(ig){ ctx.fillStyle="#141311"; ctx.font="600 22px 'Jost',Arial,sans-serif"; ctx.fillText("@"+ig, cx, y); }

      ctx.restore();
      return cv.toDataURL("image/png");
    }

    let passUrl=null, passBk=null;
    async function showPass(bk){
      passBk=bk;
      try{ passUrl=await makeWalletCard(bk); }
      catch(e){ toast("Cita guardada ✓"); return; }
      document.getElementById("passImg").src=passUrl;
      document.getElementById("passMask").classList.add("open");
    }
    function downloadPass(){
      if(!passUrl) return;
      const a=document.createElement("a");
      a.href=passUrl; a.download=`cita-${(passBk.client.name||"lume").replace(/\s+/g,"_")}.png`;
      document.body.appendChild(a); a.click(); setTimeout(()=>document.body.removeChild(a),800);
    }
    document.getElementById("passDownload").addEventListener("click", downloadPass);
    document.getElementById("passWhats").addEventListener("click", ()=>{
      if(!passBk) return;
      downloadPass();
      const dt=new Date(passBk.date+"T00:00:00");
      const txt=`✨ ¡Cita confirmada en ${CONFIG.businessName}!\n\n`+
        `👤 ${passBk.client.name}\n📅 ${DAYS_FULL[dt.getDay()]} ${passBk.date.split("-").reverse().join("/")}\n`+
        `🕐 ${passBk.time}\n💅 ${passBk.items.map(i=>i.name).join(", ")}\n\n(Te comparto tu tarjeta de confirmación 📎)`;
      window.open(waLink(passBk.client.phone||CONFIG.whatsapp, txt), "_blank");
    });
    document.getElementById("passAgain").addEventListener("click", (e)=>{
      e.preventDefault();
      document.getElementById("passMask").classList.remove("open");
    });

    // toast
    let toastT;
    function toast(msg){
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      clearTimeout(toastT); toastT = setTimeout(()=> t.classList.remove("show"), 2600);
    }

    syncCart();
  </script>
</body>
</html>
